# .github/workflows/ci-cd.yml

name: CI/CD Pipeline

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          path: node_modules
          restore-keys: ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

  test:
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          path: node_modules
          restore-keys: ${{ runner.os }}-node-

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageReporters=text-lcov

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  securite:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          path: node_modules
          restore-keys: ${{ runner.os }}-node-

      - name: Run lint (SAST simple)
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: securite
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    
    outputs:
      image_name: ${{ steps.build_image.outputs.image_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_image
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

          docker build -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:${{ github.sha }}

          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    env:
      IMAGE_NAME: ${{ needs.build.outputs.image_name }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID_STAGING }}
      RAILWAY_DOMAIN: ${{ vars.RAILWAY_DOMAIN_STAGING }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway up \
            --service $RAILWAY_SERVICE_ID \
            --image $IMAGE_NAME:${{ github.sha }}

      - name: Smoke test
        run: curl --fail "https://${RAILWAY_DOMAIN}/health"

  deploy-prod:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: github.ref == 'refs/heads/main'
    env:
      IMAGE_NAME: ${{ needs.build.outputs.image_name }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID_PROD }}
      RAILWAY_DOMAIN: ${{ vars.RAILWAY_DOMAIN_PROD }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: |
          railway up \
            --service $RAILWAY_SERVICE_ID \
            --image $IMAGE_NAME:${{ github.sha }}

      - name: Smoke test
        run: curl --fail "https://${RAILWAY_DOMAIN}/health"